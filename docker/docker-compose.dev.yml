services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cf
      POSTGRES_PASSWORD: cf
      POSTGRES_DB: collabforge
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cf']
      interval: 10s

  # solo con: docker compose -f docker/docker-compose.dev.yml --profile scale up
  valkey:
    image: valkey/valkey:8-alpine
    ports: ['6379:6379']
    profiles: ['scale']

volumes:
  pgdata:
